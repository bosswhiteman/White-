# Déploiement Netlify — Messi Store (Next.js 16)
# Netlify détecte Next.js automatiquement et applique son runtime (OpenNext).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  COOKIE_SECURE = "true"

# Variables à définir dans Netlify > Site configuration > Environment variables :
#   DATABASE_URL    (obligatoire) chaîne PostgreSQL, ex. Neon / Netlify DB avec ?sslmode=require
#   ADMIN_SECRET    (recommandé) longue chaîne aléatoire pour signer les sessions admin
#   ADMIN_EMAIL     (optionnel) e-mail de l'administrateur
#   ADMIN_PASSWORD  (optionnel) mot de passe initial de l'administrateur
